name: Fast checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ubuntu-24.04
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869

      - name: Run repository checks
        run: ./scripts/check-local.sh

      - name: Check cask syntax
        run: brew ruby -- -c proposals/Casks/emacs-app-linux.rb.example
