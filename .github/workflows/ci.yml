name: Validate Emacs PGTK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  formula:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Homebrew
        id: setup-homebrew
        uses: Homebrew/actions/setup-homebrew@a657b8b0cd35d0f65cce41fce9b24cf054b49869

      - name: Cache Homebrew Ruby gems
        uses: actions/cache@v5
        with:
          path: ${{ steps.setup-homebrew.outputs.gems-path }}
          key: ${{ matrix.runner }}-rubygems-${{ steps.setup-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.runner }}-rubygems-

      - name: Run fast checks
        run: ./scripts/check-local.sh

      - name: Install from source
        run: ./scripts/install-local.sh

      - name: Run feature smoke test
        run: ./scripts/smoke-test.sh "$(brew --prefix emacs-pgtk)/bin/emacs"

      - name: Check linked dependencies
        run: brew linkage --test emacs-pgtk
